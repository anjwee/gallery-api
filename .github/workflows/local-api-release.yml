name: Local API Release APK

on:
  push:
    branches:
      - feature/lan-openai-api
    paths:
      - "Android/src/**"
      - ".github/workflows/local-api-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager --channel=3 "platforms;android-37"

      - name: Build Release APK
        working-directory: Android/src
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-gallery-local-api-release
          path: Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
